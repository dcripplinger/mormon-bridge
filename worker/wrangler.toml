name = "mormon-bridge"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
# Free plan requires SQLite-backed Durable Objects.
new_sqlite_classes = ["RoomDurableObject"]

[vars]
# Comma-separated origins allowed for browser WebSocket / CORS (dev + itch).
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
